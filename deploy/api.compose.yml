# The API, as deployed.
#
# Separate from docker-compose.yml because that file is the whole system on one
# host — what somebody who just cloned the repository runs. Here the store is
# its own deployment: PostgreSQL is a managed resource and the ledger has its
# own stack, so this file contains only the one thing that shares this
# lifecycle.
#
# No `seed` service here, unlike docker-compose.yml: this deployment runs on
# a real person's real data (their own registration, plus the bank-import and
# IBKR-sync pipelines), and importing the technical-test demo dataset into it
# would mean seeing somebody else's ~1600 fake accounts of history in your
# own bank. The demo dataset still exists — docker-compose.yml's `seed`
# service, gated behind `--profile seed`, is for a separate standalone demo
# instance, not this one.
#
# Not a Dokploy "Application", which would deploy this as a Swarm service. Swarm
# ignores security_opt, and the TigerBeetle client opens its own io_uring — under
# the default seccomp profile it aborts with "failed to initialize IO:
# PermissionDenied" and takes the process down. This has to be plain compose.

services:
  api:
    build:
      context: ../api
    image: corebank-api
    security_opt:
      # Required by the ledger client, not by the HTTP server. See the note above.
      - seccomp=unconfined
    environment:
      HTTP_ADDR: ":8080"
      # The managed PostgreSQL, by Swarm service name on the shared network. pgx
      # resolves hostnames, so no fixed address is needed here.
      DATABASE_URL: ${DATABASE_URL}
      # The ledger, by fixed address: its client parses this itself and takes only
      # IP:port, refusing a hostname with "invalid client cluster address". The
      # address is assigned in the ledger's own stack.
      TB_ADDRESSES: ${TB_ADDRESSES:-10.77.0.10:3001}
      TB_CLUSTER_ID: ${TB_CLUSTER_ID:-0}
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Set in the deployment's variables, never in this file. Left empty the API
      # signs with a per-process secret and every restart logs everybody out.
      JWT_SECRET: ${JWT_SECRET}
      CONFIRMATION_TTL: ${CONFIRMATION_TTL:-2m}
      # Empty is a supported state: the assistant answers from its rule-based
      # fallback, drives the same MCP tools and the same confirmation flow, and the
      # interface says which engine is active.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      # The spend ceilings, in dollars, set in the deployment's variables.
      #
      # This deployment is public, registration is open and the test credentials are
      # in the README, so the key above is reachable by anybody who opens the page.
      # The API reserves a call's estimated cost before making it and refuses to start
      # one that would cross a ceiling — it then answers from the rule-based engine
      # and the interface says the budget is what ran out, rather than claiming the
      # assistant is briefly unavailable.
      AI_BUDGET_USD: ${AI_BUDGET_USD:-4.00}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-1.00}
      AI_USER_DAILY_BUDGET_USD: ${AI_USER_DAILY_BUDGET_USD:-0.30}
      AI_MAX_TOOL_TURNS: ${AI_MAX_TOOL_TURNS:-4}
      # Set in the deployment's variables to enable linking an IBKR account.
      # Empty is a supported state: SetLink refuses with a clear error and
      # everything else keeps working — see config.IBKRConfig.
      IBKR_TOKEN_ENCRYPTION_KEY: ${IBKR_TOKEN_ENCRYPTION_KEY:-}
    # No published ports. Traefik reaches this over the shared network.
    networks:
      - dokploy-network
      - ledger
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

networks:
  # Dokploy's shared network: how Traefik reaches the API and how the API reaches
  # the managed PostgreSQL.
  dokploy-network:
    external: true
  # Created by the ledger's own stack, which is why it is external here — this
  # deployment joins it rather than defining it, and cannot take it down.
  ledger:
    name: corebank-ledger
    external: true
