name: corebank

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — identity, credentials and transaction metadata.
  # It deliberately holds NO balance column: balances live in TigerBeetle.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corebank}
      POSTGRES_DB: ${POSTGRES_DB:-corebank}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corebank} -d ${POSTGRES_DB:-corebank}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # TigerBeetle data file initialisation.
  #
  # `format` must run exactly once per data file: running it twice destroys the
  # ledger, and starting without it fails outright. This one-shot service is
  # idempotent — it checks for the file before formatting — and the replica
  # below waits for it to exit successfully.
  # ---------------------------------------------------------------------------
  tigerbeetle-format:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    security_opt:
      # Docker's default seccomp profile blocks the io_uring syscalls that
      # TigerBeetle requires (io_uring_setup / _enter / _register). Without
      # this, `format` aborts with "io_uring is not available: PermissionDenied".
      # The API and the one-shot jobs need it as well, because the Go client opens its
      # own io_uring. `web` is the only container on the default profile.
      - seccomp=unconfined
    volumes:
      - tb-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/0_0.tigerbeetle ]; then
          echo "TigerBeetle data file already present — skipping format."
        else
          echo "Formatting TigerBeetle data file..."
          /tigerbeetle format \
            --cluster=${TB_CLUSTER_ID:-0} \
            --replica=0 \
            --replica-count=1 \
            /data/0_0.tigerbeetle
        fi
    restart: "no"

  # ---------------------------------------------------------------------------
  # TigerBeetle replica — the financial source of truth.
  # ---------------------------------------------------------------------------
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    security_opt:
      - seccomp=unconfined # see tigerbeetle-format above
    # A fixed address, because the TigerBeetle client parses TB_ADDRESSES itself and
    # accepts only IP:port. Given a service name it refuses before connecting:
    # "invalid client cluster address". Docker's DNS is therefore no help here, and
    # this is the address the API and the one-shot jobs are pointed at.
    networks:
      default:
        ipv4_address: 10.77.0.10
    volumes:
      - tb-data:/data
    command:
      - start
      - --addresses=0.0.0.0:3001
      - --cache-grid=${TB_CACHE_GRID:-256MiB}
      - /data/0_0.tigerbeetle
    ports:
      - "${TB_PORT:-3001}:3001"
    depends_on:
      tigerbeetle-format:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/nc", "-z", "127.0.0.1", "3001"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # The API. Applies its embedded migrations on startup, so there is no separate
  # migrate step that can be skipped or run out of order.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./api
    image: corebank-api
    # The TigerBeetle *client* uses io_uring too, not just the replica. Under the
    # default seccomp profile tb_client_init aborts with
    # "failed to initialize IO: PermissionDenied" and takes the process with it, so
    # every container that opens a ledger connection needs this — the API, the jobs
    # and TigerBeetle itself. Only `web` keeps the default profile.
    security_opt:
      - seccomp=unconfined
    environment:
      HTTP_ADDR: ":8080"
      # Service names, not localhost: inside the network these resolve to the
      # other containers.
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-corebank}:${POSTGRES_PASSWORD:-corebank}@postgres:5432/${POSTGRES_DB:-corebank}?sslmode=disable
      TB_ADDRESSES: 10.77.0.10:3001
      TB_CLUSTER_ID: ${TB_CLUSTER_ID:-0}
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Empty is allowed: the API then signs tokens with a per-process secret, so
      # everything works but sessions do not survive a restart.
      JWT_SECRET: ${JWT_SECRET:-}
      # An existing local database from before migration 00011 needs this set
      # to 00011 once; a fresh volume does not. See deploy/api.compose.yml.
      COREBANK_CONFIRM_WIPE: ${COREBANK_CONFIRM_WIPE:-}
      # Unused in this stack — nginx serves the SPA and proxies /api on the same
      # origin, so no browser ever makes a cross-origin request. Passed through
      # for anyone pointing `npm run dev` at the containerised API.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # The chat's only external dependency. Left empty the application runs in
      # full and the assistant answers from its rule-based fallback.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      # What the assistant may spend, in dollars. The key above is real money, so
      # these are a hard ceiling and not a suggestion: the API reserves a call's
      # estimated cost before making it and refuses to start one that would cross a
      # ceiling, then answers from the rule-based engine and says so in the
      # interface. Zero disables spending entirely, which is a supported state.
      AI_BUDGET_USD: ${AI_BUDGET_USD:-4.00}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-1.00}
      AI_USER_DAILY_BUDGET_USD: ${AI_USER_DAILY_BUDGET_USD:-0.30}
      # Rounds of tools per message. Each round re-sends the conversation, so this
      # is a cost ceiling as much as a safety one.
      AI_MAX_TOOL_TURNS: ${AI_MAX_TOOL_TURNS:-4}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      tigerbeetle:
        condition: service_healthy
    healthcheck:
      # /healthz reports on both stores, so a healthy API means the whole money
      # path is reachable — which is what `web` is waiting for. `--fail`
      # is what turns a 503 from a degraded check into a failed healthcheck rather
      # than a successful fetch of bad news.
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # IBKR portfolio sync — a one-shot job, not started by a plain
  # `docker compose up` (see the profile below). Run it on demand with
  # `docker compose --profile ibkrsync run --rm ibkrsync`, or point an external
  # scheduler (cron, a Dokploy scheduled job) at that same command. It needs
  # IBKR_TOKEN_ENCRYPTION_KEY set to do anything — see .env.example.
  # ---------------------------------------------------------------------------
  ibkrsync:
    build:
      context: ./api
    image: corebank-api
    command: ["ibkrsync"]
    profiles: ["ibkrsync"]
    security_opt:
      - seccomp=unconfined # the ledger client needs it; see `api` above
    environment:
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-corebank}:${POSTGRES_PASSWORD:-corebank}@postgres:5432/${POSTGRES_DB:-corebank}?sslmode=disable
      TB_ADDRESSES: 10.77.0.10:3001
      TB_CLUSTER_ID: ${TB_CLUSTER_ID:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IBKR_TOKEN_ENCRYPTION_KEY: ${IBKR_TOKEN_ENCRYPTION_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # The interface. nginx serves the built SPA and proxies /api to the backend, so
  # the browser only ever talks to one origin.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
    image: corebank-web
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

networks:
  # The default network gets an explicit subnet so TigerBeetle can be given a fixed
  # address on it. 10.77 is outside Docker's own pools (172.17–172.31) to keep the
  # range from colliding with a network the host already has.
  default:
    ipam:
      config:
        - subnet: 10.77.0.0/24

volumes:
  pg-data:
  tb-data:
