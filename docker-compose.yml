name: corebank

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — the only data store: users, accounts, every imported line and
  # the balances the banks stated.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corebank}
      POSTGRES_DB: ${POSTGRES_DB:-corebank}
    # Small on purpose: this is one person's finances.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    mem_limit: 256m
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corebank} -d ${POSTGRES_DB:-corebank}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # The API. Applies its embedded migrations on startup, so there is no separate
  # migrate step that can be skipped or run out of order.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./api
    image: corebank-api
    mem_limit: 160m
    environment:
      HTTP_ADDR: ":8080"
      # Service names, not localhost: inside the network these resolve to the
      # other containers.
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-corebank}:${POSTGRES_PASSWORD:-corebank}@postgres:5432/${POSTGRES_DB:-corebank}?sslmode=disable
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Empty is allowed: the API then signs tokens with a per-process secret, so
      # everything works but sessions do not survive a restart.
      JWT_SECRET: ${JWT_SECRET:-}
      # An existing local database from before migration 00011 needs this set
      # to 00011 once; a fresh volume does not. See deploy/api.compose.yml.
      COREBANK_CONFIRM_WIPE: ${COREBANK_CONFIRM_WIPE:-}
      # Unused in this stack — nginx serves the SPA and proxies /api on the same
      # origin, so no browser ever makes a cross-origin request. Passed through
      # for anyone pointing `npm run dev` at the containerised API.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # The chat's only external dependency. Left empty the application runs in
      # full and the assistant says it is unavailable.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      # What the assistant may spend, in dollars. The key above is real money, so
      # these are a hard ceiling and not a suggestion: the API reserves a call's
      # estimated cost before making it and refuses to start one that would cross a
      # ceiling, and the interface says the budget is what ran out. Zero disables spending entirely, which is a supported state.
      AI_BUDGET_USD: ${AI_BUDGET_USD:-4.00}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-1.00}
      AI_USER_DAILY_BUDGET_USD: ${AI_USER_DAILY_BUDGET_USD:-0.30}
      # Rounds of tools per message. Each round re-sends the conversation, so this
      # is a cost ceiling as much as a safety one.
      AI_MAX_TOOL_TURNS: ${AI_MAX_TOOL_TURNS:-4}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /healthz checks PostgreSQL, so a healthy API means the data is reachable —
      # which is what `web` is waiting for. `--fail`
      # is what turns a 503 from a degraded check into a failed healthcheck rather
      # than a successful fetch of bad news.
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # IBKR portfolio sync — a one-shot job, not started by a plain
  # `docker compose up` (see the profile below). Run it on demand with
  # `docker compose --profile ibkrsync run --rm ibkrsync`, or point an external
  # scheduler at that same command — once a day in the morning, since IBKR
  # publishes a day's Flex data only after its overnight processing. It needs
  # IBKR_TOKEN_ENCRYPTION_KEY set to do anything — see .env.example.
  # ---------------------------------------------------------------------------
  ibkrsync:
    build:
      context: ./api
    image: corebank-api
    command: ["ibkrsync"]
    profiles: ["ibkrsync"]
    environment:
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-corebank}:${POSTGRES_PASSWORD:-corebank}@postgres:5432/${POSTGRES_DB:-corebank}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IBKR_TOKEN_ENCRYPTION_KEY: ${IBKR_TOKEN_ENCRYPTION_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # The interface. nginx serves the built SPA and proxies /api to the backend, so
  # the browser only ever talks to one origin.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
    image: corebank-web
    mem_limit: 32m
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  pg-data:
