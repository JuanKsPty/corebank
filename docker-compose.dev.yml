# The database, for running the API and the interface from source.
#
# Same project name and same volume name as docker-compose.yml, so this is the same
# data whichever way the stack is started.

name: corebank

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corebank}
      POSTGRES_DB: ${POSTGRES_DB:-corebank}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corebank} -d ${POSTGRES_DB:-corebank}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  pg-data:
