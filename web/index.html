<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>corebank</title>
    <meta
      name="description"
      content="Banca en línea: consulta saldos, mueve dinero entre tus cuentas y pídelo en español. Nada se mueve hasta que lo confirmas."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FBF9F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#122420" media="(prefers-color-scheme: dark)" />

    <!-- Applies the stored appearance (or the OS preference, on "Sistema") before
         React ever mounts. Without this, the page always paints light first and
         then flips — visible on every load for anyone who chose dark. Kept to
         three lines and no template literals: this runs before anything else on
         the page, including any bundler transform. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('corebank.theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          // Storage unavailable — falls back to light, same as no preference saved.
        }
      })()
    </script>

    <!-- The two variable faces the whole interface is set in. Preloaded because
         the greeting and every amount depend on them: without the hint they land
         after first paint and the numbers visibly reflow. -->
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/spline-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
